[package]
name = "mdloc"
version = "0.1.0"
edition = "2021"
authors = ["Elvis Ding <elvisding0307@gmail.com>"]
description = "A Rust command-line tool for processing image links in Markdown files. Download remote images and convert them to Base64 embedded format or local file references."
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/elvisding0307/mdloc"
keywords = ["markdown", "image", "localization"]
categories = ["command-line-utilities", "text-processing"]
rust-version = "1.86"


[dependencies]
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["rustls-tls"], default-features = false }
regex = "1.0"
base64 = "0.21"
url = "2.0"
sha1 = "0.10"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
urlencoding = "2.1"
