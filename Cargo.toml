[package]
name = "mdloc"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["rustls-tls"], default-features = false }
regex = "1.0"
base64 = "0.21"
url = "2.0"
sha1 = "0.10"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
urlencoding = "2.1"
